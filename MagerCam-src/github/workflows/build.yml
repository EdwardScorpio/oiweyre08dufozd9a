name: Build MagerCam APK

# Собирает APK онлайн — на GitHub (андроид-приложение получается из артефактов запуска воркфлоу).
# Запуск: включить Actions, нажать «Run workflow».
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Android SDK
        uses: android-actions/setup-android-sdk@v3
      - name: Build APK
        working-directory: android
        run: sh gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MagerCam-release
          path: android/app/build/outputs/apk/release/app-release.apk
